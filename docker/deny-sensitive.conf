# Impide que archivos de infraestructura queden accesibles por HTTP,
# ya que todo el proyecto se monta dentro del DocumentRoot.

<FilesMatch "\.(sql|gz|tgz|tar|zip|bak|ya?ml|example|dist|log|md)$">
    Require all denied
</FilesMatch>

# Dotfiles (.env, .git, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Carpetas de infraestructura / migraciones
<DirectoryMatch "/(_dbinit|docker|_migraciones)(/|$)">
    Require all denied
</DirectoryMatch>
