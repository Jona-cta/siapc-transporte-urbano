# Bloquea el acceso HTTP a archivos y carpetas sensibles del proyecto.

<FilesMatch "\.(sql|gz|tgz|tar|zip|bak|ya?ml|example|dist|log|md)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<DirectoryMatch "/(_dbinit|docker)(/|$)">
    Require all denied
</DirectoryMatch>
