# Entorno Docker de SIAPC: web (PHP 8.2 + Apache), db (MariaDB) y phpMyAdmin.
# Arrancar: docker compose up -d --build

services:
  web:
    build: .
    container_name: siapc_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/bd_op   # sirve el proyecto bajo /bd_op
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-siapc}
      DB_PASS: ${DB_PASS:-siapc}
      DB_NAME: ${DB_NAME:-turbano_bd_op}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: siapc_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-turbano_bd_op}
      MYSQL_USER: ${DB_USER:-siapc}
      MYSQL_PASSWORD: ${DB_PASS:-siapc}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./_dbinit:/docker-entrypoint-initdb.d   # scripts SQL de inicializacion
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: siapc_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
